<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Friction Gate</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #1e1e1e;
        color: #f2f2f2;
        padding: 20px;
      }
      h1 { font-size: 18px; margin-bottom: 8px; }
      p { font-size: 13px; color: #bbb; margin-bottom: 12px; }
      .countdown {
        font-size: 28px;
        font-weight: 600;
        margin: 16px 0;
        text-align: center;
      }
      input {
        width: 100%;
        padding: 10px;
        border-radius: 6px;
        border: 1px solid #444;
        background: #111;
        color: #fff;
        margin-bottom: 12px;
      }
      input:disabled { opacity: 0.5; }
      .actions { display: flex; gap: 8px; justify-content: flex-end; }
      button {
        padding: 8px 14px;
        border-radius: 6px;
        border: none;
        cursor: pointer;
      }
      #confirm-btn { background: #d9534f; color: #fff; }
      #confirm-btn:disabled { opacity: 0.5; cursor: not-allowed; }
      #cancel-btn { background: #444; color: #fff; }
      .error { color: #ff8a80; font-size: 12px; min-height: 18px; }
    </style>
  </head>
  <body>
    <h1>Confirm this action</h1>
    <p id="subtitle">Wait for the countdown, then type your confirmation phrase.</p>
    <div class="countdown" id="countdown">30</div>
    <input id="phrase-input" type="password" placeholder="Confirmation phrase" disabled />
    <div class="error" id="error"></div>
    <div class="actions">
      <button id="cancel-btn" type="button">Cancel</button>
      <button id="confirm-btn" type="button" disabled>Confirm</button>
    </div>
    <script src="friction.js"></script>
  </body>
</html>
