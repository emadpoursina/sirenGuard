<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reminder</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="overlay">
      <div id="media-wrap" class="media-wrap" hidden></div>
      <p id="caption" class="caption"></p>
      <p id="fallback" class="fallback" hidden>No reminder media configured.</p>
      <div class="footer">
        <span id="countdown" class="countdown">10</span>
        <button id="continue-btn" type="button" disabled>Continue</button>
      </div>
    </main>
    <script src="reminder.js"></script>
  </body>
</html>
